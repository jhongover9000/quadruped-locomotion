[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadruped-rl"
version = "0.1.0"
description = "Comparing RL methods for quadruped locomotion: sim training, real2sim, and hardware deployment"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Joseph Hong" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "mujoco>=3.3",
  "pyyaml>=6.0",
  "torch>=2.3",
  "tensorboard>=2.16",
  "matplotlib>=3.8",
  "tqdm",
]

[project.optional-dependencies]
# GPU-parallel simulation (MuJoCo Warp) + rsl_rl reference PPO. NVIDIA GPU, Linux/WSL2.
# Pinned to the version this code was written against; upgrade deliberately.
mjlab = ["mjlab==1.6.0"]
trajopt = ["pin>=2.7", "casadi>=3.6"]      # reference-gait trajectory optimization
sysid = ["cma>=3.3"]                       # black-box parameter fitting
deploy = ["onnx", "onnxruntime"]
logging = ["wandb"]
dev = ["pytest", "ruff", "ipykernel", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not sim'"
markers = ["sim: builds a simulated environment (slow the first time; run with `pytest -m sim`)"]
