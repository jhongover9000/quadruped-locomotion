# Does a lower body help? Hold a target base height per run and compare
# stability, cost of transport, and jerk.
task: flat_velocity
robot: go1
algorithms: [ppo]
seeds: [0, 1, 2]
fixed:                         # applied to every run
  rewards.base_height: -30.0
grid:                          # m, Go1 values
  reward_params.base_height_target: [0.22, 0.25, 0.28, 0.31]
