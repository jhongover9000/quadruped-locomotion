# Reference-motion tracking: follow retargeted motion-capture clips frame by frame.
# For SuperMimic and DeepMimic, which train on the same clips in the same environment.
#
# The environment is the SuperMimic backend's: observations, the tracking reward and its
# scales come from the robot's SuperMimic RobotSpec, not from this file. This file says
# which clips, how they are sampled, and when an episode ends.
name: motion_tracking
kind: tracking

sim:
  episode_length_s: 10.0              # training episodes; a clip's end also ends one

motions:
  # Clip library (50 Hz .npz, format in src/quadruped_rl/motions/format.py). Relative paths
  # are looked up in this repository, then in the SuperMimic reference repository.
  # {robot} is the robot's SuperMimic spec name.
  dir: data/npz/{robot}
  manifest: data/npz/{robot}/manifest.csv   # name, keep, group columns
  train_groups: train,hard            # manifest groups used for training
  eval_groups: holdout                # played by play.py / record.py / evaluate.py
  exclude: null                       # regex on clip names to leave out
  clips: null                         # or an explicit list of clip names
  limit: null
  future_frames: 10                   # reference frames the policy sees ahead
  sampling:
    mode: return                      # return: favour clips the policy does badly on | uniform
    clip_weight_alpha: 0.5            # p(clip) ~ duration^alpha (1 = uniform over frames)
    static_bin_factor: 0.25           # down-weight stretches where the animal stands still

terminations:
  root_height_error_m: null           # |reference - robot| trunk height (null: robot spec)
  root_tilt_error: null               # trunk tilt error (null: robot spec)
