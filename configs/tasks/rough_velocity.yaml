# Velocity tracking over a terrain curriculum. Only differences from flat are listed.
inherit: tasks/flat_velocity.yaml
name: rough_velocity

terrain:
  type: curriculum
  tile_size: [8.0, 8.0]       # m
  levels: 10                  # difficulty rows; robots walking past half a tile move up
  tiles_per_level: 20
  max_init_level: 5
  # Sub-terrains: any preset name from mjlab.terrains.config. A number is the
  # proportion; a mapping also overrides the preset's parameters.
  sub_terrains:
    flat: 0.2
    pyramid_stairs: {proportion: 0.2, step_height_range: [0.0, 0.1]}       # m, scale to leg length
    pyramid_stairs_inv: {proportion: 0.2, step_height_range: [0.0, 0.1]}
    hf_pyramid_slope: {proportion: 0.1, slope_range: [0.0, 1.0]}
    hf_pyramid_slope_inv: {proportion: 0.1, slope_range: [0.0, 1.0]}
    random_rough: 0.1
    wave_terrain: 0.1

observations:
  critic: [base_lin_vel, base_ang_vel, projected_gravity, velocity_command, joint_pos_rel,
           joint_vel, last_action, foot_contacts, height_scan]

rewards:
  flat_orientation: -0.2      # relax: the body must tilt on slopes
  # The gait-shaping terms (foot_clearance, feet_slip, feet_stumble, base_height_band,
  # knee_bend, torques_rated), their reward_params and reward_ramps come from
  # flat_velocity.yaml with weight 0. foot_clearance (height above the last touchdown) and
  # base_height_band (height above the feet in contact) do not assume flat ground.

terminations:
  bad_orientation_rad: null   # tilting is expected on slopes; base contact still ends episodes
