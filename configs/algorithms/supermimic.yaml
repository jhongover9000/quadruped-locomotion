# SuperMimic-style: learned differentiable world model + BPTT over short imagined rollouts.
# PLACEHOLDER values -- set from the paper (arXiv 2610.28480) and the reference
# reimplementation before running. Adapting it from humanoids to a quadruped is part of the work.
name: supermimic
default_task: motion_tracking
num_envs: 4096
max_iterations: 3000
world_model:
  hidden: [2048, 2048, 2048]
  learning_rate: 3.0e-4
  updates_per_iteration: 8
  replay_buffer_size: 2000000
policy:
  hidden: [512, 256, 128]
  learning_rate: 3.0e-4
imagination:
  horizon: 16                 # TODO: tune
  terminal_critic: true
  gamma: 0.99
save_interval: 200
