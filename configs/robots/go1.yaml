# Stand-in robot: Unitree Go1 from MuJoCo Menagerie.
# Fetch the model first:   python scripts/setup/download_stand_in.py
# Values are typical Go1 sim settings -- verify against the downloaded XML.
name: go1
model_path: assets/robots/stand_in/unitree_go1/scene.xml
base_body: trunk
foot_geoms: [FR, FL, RR, RL]          # order must match robots.config.LEGS

# Policy action / observation order. Never reorder after training.
joint_names:
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint

# A 3-vector means [hip, thigh, calf], repeated for all four legs.
default_joint_pos: [0.0, 0.9, -1.8]   # rad
base_height_nominal: 0.27             # m, trunk height in the default stance
mass_nominal: 12.7                    # kg (approximate)

actuator:
  model: ideal_pd                     # ideal_pd -> analytic / actuator_net after sysID
  kp: 20.0                            # N*m/rad
  kd: 0.5                             # N*m*s/rad
  torque_limit: [23.7, 23.7, 35.55]   # N*m
  velocity_limit: [30.1, 30.1, 20.06] # rad/s
  armature: [0.01, 0.01, 0.01]        # kg*m^2, reflected rotor inertia N^2 * I_rotor
  params: {}

# Per-episode ranges. Widen anything you are unsure about.
domain_randomization:
  friction: [0.4, 1.25]
  added_base_mass: [-1.0, 3.0]        # kg
  base_com_offset: [-0.03, 0.03]      # m, each axis
  motor_strength: [0.9, 1.1]          # torque scale
  kp_scale: [0.9, 1.1]
  kd_scale: [0.9, 1.1]
  action_delay_steps: [0, 1]          # control steps
  push_interval_s: 8.0
  push_velocity: 0.5                  # m/s
